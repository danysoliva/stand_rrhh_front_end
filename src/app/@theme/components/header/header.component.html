<dx-popup [width]="285" height="auto" [showTitle]="true" title="Cambiar PIN" [dragEnabled]="false"
  [showCloseButton]="false" container="body" [(visible)]="popupVisible">
  <div *dxTemplate="let data of 'content'">
    <dx-scroll-view width="100%" height="100%">

      <div class="container-control-one m-t-10">
        <div class="control-one-no-padding">
          <span>Nuevo PIN<b style="color:red;">*</b></span>
          <div class="validate-container">
            <dx-text-box [formControl]="fcPIN" mode="password" width="100%" (onKeyUp)="keyUpPIN($event)">
            </dx-text-box>
            <i class="material-icons icon-red" *ngIf="pinValido === false">cancel</i>
            <i class="material-icons icon-green" *ngIf="pinValido === true">check_circle</i>
          </div>
          <div class="validate-text">
            <span *ngIf="pinNoEsNumero === true">El pin debe contener sólo números</span>
            <span *ngIf="pinMenorACuatro === true">El pin debe tener por lo menos 4 dígitos</span>
            <span *ngIf="pinTresDigitosConsecutivos === true">El pin no puede contener 3 dígitos consecutivos</span>
            <span *ngIf="pinTresIgualesConsecutivos === true">El pin no puede contener 3 dígitos iguales de forma
              consecutiva</span>
          </div>
        </div>
      </div>

      <div class="container-control-one m-t-10">
        <div class="control-one-no-padding">
          <span>Confirmar PIN<b style="color:red;">*</b></span>
          <div class="validate-container">
            <dx-text-box [formControl]="fcConfirmarPIN" mode="password" width="100%"
              (onKeyUp)="keyUpConfirmarPIN($event)">
            </dx-text-box>
            <i class="material-icons icon-red" *ngIf="pinConfirmado === false">cancel</i>
            <i class="material-icons icon-green" *ngIf="pinConfirmado === true">check_circle</i>
          </div>
          <div class="validate-text">
            <span *ngIf="pinNoCoincide === true">El pin no coinciden</span>
          </div>
        </div>
      </div>

      <div class="container-bottom p-r-8">
        <button nbButton outline status="success" class="float-r m-l-5"
          [disabled]="fcPIN.invalid || (fcConfirmarPIN.invalid && pinConfirmado === false)"
          (click)="cambiarPIN()">Cambiar</button>
        <button nbButton outline status="danger" class="float-r m-r-5" (click)="cancelar()">Cancelar</button>
      </div>

    </dx-scroll-view>
  </div>
</dx-popup>
