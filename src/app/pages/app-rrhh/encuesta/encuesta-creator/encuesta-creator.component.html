<nb-card class="inline-form-card">
    <nb-card-header>Generar Encuesta</nb-card-header>
    <nb-card-body>
        <button nbButton outline status="primary" class="m-b-10" (click)="generar()">
            <nb-icon icon="plus-square" pack="eva">

            </nb-icon> Agregar Pregunta
        </button>

        <input [formControl]="titulo" type="text" class="form-control text-uppercase"
            placeholder="Agregue un titulo a la encuesta" style="margin-bottom: 25px;">
        <div *ngFor="let item of preguntas" class="row" style="margin-top: 25px;margin-bottom: 25px;">
            
            <div class="col-lg-12" id="{{ 'crud' + item.id}}">
                <!-- <button type="button" >Editar</button> -->
                <button style="text-align: center;margin-right: 10px;padding: 5px 10px;" nbButton status="warning" type="button"
                    (click)="editar($event)">Editar
                    <nb-icon icon="edit-2-outline" pack="eva"></nb-icon>
                </button>
                <button style="text-align: center;padding: 5px 10px;" nbButton status="danger" type="button"
                    (click)="eliminar($event)">Eliminar
                    <nb-icon icon="trash-2-outline" pack="eva"></nb-icon>
                </button>
            </div>
            <div class="col-lg-12">
                <h2>{{item.pregunta}}</h2>
                <ul class="list-group" *ngFor="let elemento of item.opciones">
                    <li class="list-group-item">{{elemento}}</li>
                </ul>
            </div>
            
        </div>
        <button [disabled]="titulo.invalid===true || preguntas.length <= 0 " nbButton outline status="success"
            class="m-b-10" (click)="save()">Guardar</button>
    </nb-card-body>
</nb-card>

<dx-popup [width]="700" height="auto" [showTitle]="true" title="AGREGAR PREGUNTA" [dragEnabled]="false"
    [showCloseButton]="false" container="body" [(visible)]="popupVisible">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">

            <div class="row" style="display: grid;">
                <span style="font-size: 18px;font-weight: bold;">Ingrese la pregunta</span>
                <dx-text-box [formControl]="pregunta" [showClearButton]="false" height="50"
                    placeholder="Ingrese la pregunta" (onKeyUp)="keyUpPregunta($event)">
                </dx-text-box>


                <span style="font-size: 18px;font-weight: bold;margin-top: 10px;">Ingrese una opción</span>
                <div style="display: flex;width: 100%;margin:auto auto 10px auto">
                    <dx-text-box [formControl]="opcion" width="100%" [showClearButton]="false" height="30"
                        placeholder="Ingrese una opcion" (onKeyUp)="keyUpOpcion($event)"></dx-text-box>

                    <dx-button nbButton outline text="Agregar" type="success" [width]="120" (onClick)="add()"
                        [disabled]="opcionValida === false" style="margin-left: 15px !important;">
                    </dx-button>
                </div>
                <dx-list noDataText="No hay datos para mostrar" [dataSource]="opciones" [height]="200"
                    [allowItemDeleting]="allowDeletion" itemDeleteMode="static">
                </dx-list>
            </div>

            <div class="container-bottom">
                <button nbButton outline status="success" class="float-r m-l-5"
                    [disabled]="preguntaValida === false || opciones.length<=1" (click)="confirmar()">Confirmar</button>
                <button nbButton outline status="danger" class="float-r m-r-5" (click)="cancelar()">Cancelar</button>
            </div>
        </dx-scroll-view>
    </div>
</dx-popup>
