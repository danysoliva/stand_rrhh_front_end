<button nbButton outline status="primary" class="m-b-10" (click)="nuevaPlaza()">Generar Plaza Vacante</button>

<div class="row">
    <div class="col-lg-12">
        <nb-card class="inline-form-card">
            <nb-card-header>Plazas publicadas</nb-card-header>
            <nb-card-body>
                <dx-data-grid [dataSource]="plazas" rowAlternationEnabled="true" showColumnLines="false"
                    showRowLines="true" showBorders="true" wordWrapEnabled="true" columnAutoWidth="true"
                    columnMinWidth="50" keyExpr="id" hoverStateEnabled="true">
                    <dxo-filter-row [visible]="true"></dxo-filter-row>
                    <dxo-paging [pageSize]="10"> </dxo-paging>

                    <dxi-column dataField="id" caption="ID" width="100">
                    </dxi-column>
                    <dxi-column dataField="titulo" caption="Titulo">
                    </dxi-column>
                    <dxi-column dataField="fechaCreacion" caption="FechaCreacion">
                    </dxi-column>
                    <dxi-column style="text-align: center !important;" alignment="center" cellTemplate="cellRequisitos">
                    </dxi-column>
                    <dxi-column style="text-align: center !important;" alignment="center" cellTemplate="cellPostulante">
                    </dxi-column>
                    <dxi-column style="text-align: center !important;" alignment="center" cellTemplate="cellEliminar">
                    </dxi-column>


                    <div *dxTemplate="let data of 'cellRequisitos'" style="text-align:center ;">
                        <button outline style="text-align: center;" nbButton status="primary" type="success"
                            (click)="getRequisitos(data.data)"> Requisitos
                            <nb-icon icon="info-outline" pack="eva"></nb-icon>
                        </button>
                    </div>

                    <div *dxTemplate="let data of 'cellEliminar'" style="text-align:center ;">
                        <button outline style="text-align: center;" nbButton status="primary" type="success"
                            (click)="delete(data.data)"> Eliminar
                            <nb-icon icon="trash-2-outline" pack="eva"></nb-icon>
                        </button>
                    </div>

                    <div *dxTemplate="let data of 'cellPostulante'" style="text-align:center ;">
                        <button outline style="text-align: center;" nbButton status="primary" type="success"
                            (click)="postulantes(data.data)"> Postulantes
                            <nb-icon icon="people-outline" pack="eva"></nb-icon>
                        </button>
                    </div>

                </dx-data-grid>
            </nb-card-body>
        </nb-card>
    </div>
</div>

<dx-popup [width]="700" [height]="650" [showTitle]="true" title="Nueva plaza" [dragEnabled]="false"
    [showCloseButton]="true" container="body" [(visible)]="popupVisible">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">

            <form class="form-group" [formGroup]="plazaForm" (submit)="guardarPlaza()">
                <div>
                    <span class="span-class" style="margin-top: 0px;"><strong>Título:</strong></span>
                    <dx-text-box formControlName="titulo"></dx-text-box>
                    <span class="span-class"><strong>Departamento:</strong></span>
                    <dx-select-box class="control-width" [dataSource]="departamentos" placeholder="Departamentos"
                        displayExpr="descripcion" valueExpr="id" [searchMode]="searchModeOption"
                        [searchExpr]="searchExprOption" [searchTimeout]="searchTimeoutOption" [searchEnabled]="true"
                        [showClearButton]="true" formControlName="department_id"></dx-select-box>
                    <span class="span-class"><strong>Requisitos:</strong></span>
                    <dx-html-editor height="360px" formControlName="requisitos">
                        <dxo-toolbar [multiline]="isMultiline">
                            <dxi-item name="undo"></dxi-item>
                            <dxi-item name="redo"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="bold"></dxi-item>
                            <dxi-item name="italic"></dxi-item>
                            <dxi-item name="strike"></dxi-item>
                            <dxi-item name="underline"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="alignLeft"></dxi-item>
                            <dxi-item name="alignCenter"></dxi-item>
                            <dxi-item name="alignRight"></dxi-item>
                            <dxi-item name="alignJustify"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="orderedList"></dxi-item>
                            <dxi-item name="bulletList"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="color"></dxi-item>
                            <dxi-item name="background"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="link"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                            <dxi-item name="clear"></dxi-item>
                            <dxi-item name="codeBlock"></dxi-item>
                            <dxi-item name="blockquote"></dxi-item>
                            <dxi-item name="separator"></dxi-item>
                        </dxo-toolbar>
                    </dx-html-editor>
                    <div class="container-bottom">
                        <button nbButton outline status="success" class="float-r m-l-5"
                            [disabled]="plazaForm.invalid===true">Confirmar</button>
                        <button nbButton outline status="danger" type="reset" class="float-r m-r-5"
                            (click)="cancelar()">Cancelar</button>
                    </div>
                </div>
            </form>
        </dx-scroll-view>
    </div>
</dx-popup>

<dx-popup [width]="700" [height]="600" [showTitle]="true" title="Rquisitos" [dragEnabled]="false"
    [showCloseButton]="true" container="body" [(visible)]="popupVisible2">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">
            <div>
                <div [innerHTML]="requisitos"></div>
            </div>
        </dx-scroll-view>
    </div>
</dx-popup>

<dx-popup [width]="400" height="auto" [showTitle]="true" title="Confirmación" [dragEnabled]="false"
    [showCloseButton]="false" container="body" [(visible)]="popupVisible3">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">
            <span class="confirmation-title">¿Este registro se eliminará permanentemente, desea eliminarlo?</span>

            <div class="container-bottom">
                <button nbButton outline status="success" class="float-r m-l-5" (click)="confirmar()">Confirmar</button>
                <button nbButton outline status="danger" class="float-r m-r-5" (click)="cancelar2()">Cancelar</button>
            </div>
        </dx-scroll-view>
    </div>
</dx-popup>
