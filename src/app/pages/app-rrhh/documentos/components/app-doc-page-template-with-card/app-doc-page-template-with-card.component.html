<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header card-header-icon animated flash">
                <div class="card-icon card-icon-default" style="text-align: center;"><i class="material-icons"
                        style="font-size: 36px;">{{icon}}</i>
                </div>
            </div>
            <div class="card-content">
                <h3 class="card-title animated bounceInRight">
                    <strong>{{title}}</strong>
                </h3>
            </div>
            <div class="card-body" style="margin-top: 5px;">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</div>
