<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <div class="inline-form-card nb-card" style="padding: 20px;">
            <dx-button class="login-button" stylingMode="outlined" text="Ir al Login" type="normal" [width]="200" [height]="45" icon="home" (onClick)="back()">
                <!-- <nb-icon icon="save" pack="eva"></nb-icon> -->
            </dx-button>

            <div class="nb-card-header" style="font-size: 18px;">Quejas, Sugerencias, Denuncias</div>
            <nb-card-body>
                <div style="display: grid;" [formGroup]="QuejasDenunciasSugerenciasForm">
                    <span style="font-size: 18px;"><strong>Tipo:</strong> </span>
                    <dx-select-box labelMode="floating" class="control-width" [dataSource]="tipos"
                        displayExpr="descripcion" valueExpr="id" [searchMode]="searchModeOption"
                        [searchExpr]="searchExprOption" [searchTimeout]="searchTimeoutOption" [searchEnabled]="true"
                        [showClearButton]="true" formControlName="tipo">
                    </dx-select-box>
                    <br>
                    <br>
                    <br>
                    <span style="font-size: 18px;"><strong>Escriba su comentario</strong> </span>
                    <dx-text-area [height]="90" formControlName="descripcion" (onKeyUp)="keyUpComentario($event)">
                    </dx-text-area>

                    <dx-button style="margin-top: 30px;" stylingMode="outlined" text="Guardar" type="success" [width]="200" [height]="40" icon="save"
                        [disabled]="QuejasDenunciasSugerenciasForm.invalid===true || comentarioValido === false"
                        (onClick)="guardar()">
                    </dx-button>
                </div>
            </nb-card-body>
        </div>
    </div>
</div>
