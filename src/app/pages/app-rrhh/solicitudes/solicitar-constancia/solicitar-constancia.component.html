<button nbButton outline status="primary" class="m-b-10" (click)="abrirPopupSolicitarConstancia()">Solicitar
    Constancia</button>

<div class="row">
    <div class="col-lg-12">
        <nb-card class="inline-form-card">
            <nb-card-header>Mis Solicitudes de Constancia</nb-card-header>
            <nb-card-body>
                <dx-data-grid [dataSource]="solicitudesDeConstancias" rowAlternationEnabled="true"
                    showColumnLines="false" showRowLines="true" showBorders="true" wordWrapEnabled="true"
                    columnAutoWidth="true" columnMinWidth="50" keyExpr="id" hoverStateEnabled="true">

                    <dxo-export [enabled]="true"></dxo-export>
                    <dxo-filter-row [visible]="true"></dxo-filter-row>
                    <dxo-paging [pageSize]="10"> </dxo-paging>

                    <dxi-column dataField="id" caption="ID" width="60">
                    </dxi-column>
                    <dxi-column dataField="requestType" caption="Tipo de Solicitud" width="300">
                    </dxi-column>
                    <dxi-column dataField="requestState" caption="Estado" width="200"
                        cellTemplate="cellTemplateEstado">
                    </dxi-column>
                    <div *dxTemplate="let data of 'cellTemplateEstado'" class="estado-celda-grid">
                        <ng-container
                            *ngIf="iconoEstadoSolicitud(data.data.requestStateId, data.data.requestState) as ic">
                            <nb-icon class="estado-celda-grid__icon" pack="eva" [icon]="ic.icon"
                                [status]="ic.status"></nb-icon>
                        </ng-container>
                        <span>{{ data.data.requestState }}</span>
                    </div>
                    <dxi-column dataField="comment" caption="Comentario">
                    </dxi-column>
                    <dxi-column dataField="createdDate" caption="Fecha" dataType="date" format="dd/MM/yyyy HH:mm:ss"
                        width="150">
                    </dxi-column>
                    <dxi-column cellTemplate="cellTemplateHistorial" caption="Historial" width="88">
                    </dxi-column>
                    <dxi-column cellTemplate="cellTemplateEliminar" caption="Eliminar" width="120" [visible]="isVisibleEliminarColumn">
                    </dxi-column>
                    <div *dxTemplate="let data of 'cellTemplateHistorial'">
                        <button style="display: block; margin: auto;" nbButton outline status="info"
                            class="p-t-5 p-b-5 p-l-8 p-r-8 fs-13" title="Historial"
                            (click)="abrirHistorial(data.data.id)">
                            <nb-icon icon="list-outline" pack="eva"></nb-icon>
                        </button>
                    </div>
                    <div *dxTemplate="let data of 'cellTemplateEliminar'">
                        <button style="display: block; margin: auto;"
                            *ngIf="data.data.requestStateId === estadoSolicitudEnum.EnProceso" nbButton outline
                            status="danger" class="p-t-5 p-b-5 p-l-8 p-r-8 fs-13"
                            (click)="abrirPopupConfirmarEliminacion(data.data.id)">
                            <span style="font-size: 12px;">Eliminar</span>
                            <nb-icon icon="close" pack="eva" style="margin: auto;"></nb-icon>
                        </button>
                    </div>

                    <!-- <dxi-column style="text-align: center !important;" cellTemplate="cellTemplate" caption="Detalle"
                    [formItem]="{visible: false}"></dxi-column>
                <dxi-column style="text-align: center !important;" cellTemplate="cellAdjunto" caption="Adjunto"
                    [formItem]="{visible: false}"></dxi-column>
            
                <div *dxTemplate="let data of 'cellTemplate'">
                    <button style="text-align: center;" nbButton status="primary" type="success" (click)="detalle(data)">
                        <nb-icon icon="expand-outline" pack="eva"></nb-icon>
                    </button>
                </div>
                <div *dxTemplate="let data of 'cellAdjunto'">
                    <button style="text-align: center;" nbButton status="primary" type="success" (click)="detalle2(data)">
                        <nb-icon icon="attach-outline" pack="eva"></nb-icon>
                    </button>
                </div> -->
                </dx-data-grid>

            </nb-card-body>
        </nb-card>
    </div>
</div>

<dx-popup [width]="300" height="auto" [showTitle]="true" title="Solicitud de Constancia" [dragEnabled]="false"
    [showCloseButton]="false" container="body" [(visible)]="popupSolicitarConstanciaVisible">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">
            <div class="container-control-one">
                <div class="control-one-no-padding">
                    <span>Tipo de Constancia<b style="color:red;">*</b></span>
                    <dx-radio-group [formControl]="fcTipoConstanciaId" layout="horizontal" [items]="tipoConstancias"
                        valueExpr="id" displayExpr="name">
                    </dx-radio-group>
                </div>
            </div>

            <div class="container-bottom p-r-26">
                <button nbButton outline status="success" class="float-r m-l-5" [disabled]="fcTipoConstanciaId.invalid"
                    (click)="solicitar()">Solicitar</button>
                <button nbButton outline status="danger" class="float-r m-r-5"
                    (click)="cerrarPopupSolicitarConstancia()">Cancelar</button>
            </div>
        </dx-scroll-view>
    </div>
</dx-popup>

<dx-popup [width]="520" height="auto" [showTitle]="true" title="Confirmar Eliminación" [dragEnabled]="false"
    [showCloseButton]="false" container="body" [(visible)]="popupConfirmarEliminacionVisible">
    <div *dxTemplate="let data of 'content'">
        <dx-scroll-view width="100%" height="100%">
            <span class="confirmation-title">¿Está completamente seguro(a) de eliminar la solicitud constancia?</span>

            <div class="container-bottom p-r-26">
                <button nbButton outline status="success" class="float-r m-l-5" (click)="eliminar()">Eliminar</button>
                <button nbButton outline status="danger" class="float-r m-r-5"
                    (click)="cerrarPopupConfirmarEliminacion()">Cancelar</button>
            </div>
        </dx-scroll-view>
    </div>
</dx-popup>

<dx-popup [width]="780" [height]="460" [showTitle]="true"
    [title]="'Historial — solicitud #' + solicitudHistorialId" [dragEnabled]="false" [showCloseButton]="true"
    container="body" [(visible)]="popupHistorialVisible" (onHiding)="cerrarPopupHistorial()">
    <div *dxTemplate="let data of 'content'">
        <dx-data-grid [dataSource]="historialItems" [height]="360" [showBorders]="true" [rowAlternationEnabled]="true"
            [columnAutoWidth]="true">
            <dxo-paging [pageSize]="10"></dxo-paging>
            <dxi-column dataField="fechaHora" caption="Fecha (hora local)" dataType="datetime"
                format="dd/MM/yyyy HH:mm:ss" width="168"></dxi-column>
            <dxi-column dataField="accion" caption="Acción" width="180"></dxi-column>
            <dxi-column dataField="estadoAnteriorNombre" caption="Estado anterior" width="180"
                cellTemplate="cellTemplateEstadoAnteriorHistorial"></dxi-column>
            <dxi-column dataField="estadoNuevoNombre" caption="Estado nuevo" width="180"
                cellTemplate="cellTemplateEstadoNuevoHistorial"></dxi-column>
            <dxi-column dataField="usuarioNombre" caption="Usuario" width="200"
                cellTemplate="cellTemplateUsuarioHistorial"></dxi-column>
            <!-- <dxi-column dataField="usuarioId" caption="Usuario #" width="88"></dxi-column> -->
            <!-- <dxi-column dataField="detalle" caption="Detalle"></dxi-column> -->

            <div *dxTemplate="let data of 'cellTemplateUsuarioHistorial'" class="usuario-celda-grid">
                <ng-container *ngIf="textoUsuarioHistorial(data.data) as usuarioTexto">
                    <nb-icon class="usuario-celda-grid__icon" pack="eva" icon="person-outline"
                        status="info"></nb-icon>
                    <span>{{ usuarioTexto }}</span>
                </ng-container>
            </div>
            <div *dxTemplate="let data of 'cellTemplateEstadoAnteriorHistorial'" class="estado-celda-grid">
                <ng-container
                    *ngIf="iconoEstadoSolicitud(data.data.estadoAnteriorId, data.data.estadoAnteriorNombre) as ic">
                    <nb-icon class="estado-celda-grid__icon" pack="eva" [icon]="ic.icon"
                        [status]="ic.status"></nb-icon>
                </ng-container>
                <span>{{ data.data.estadoAnteriorNombre }}</span>
            </div>
            <div *dxTemplate="let data of 'cellTemplateEstadoNuevoHistorial'" class="estado-celda-grid">
                <ng-container
                    *ngIf="iconoEstadoSolicitud(data.data.estadoNuevoId, data.data.estadoNuevoNombre) as ic">
                    <nb-icon class="estado-celda-grid__icon" pack="eva" [icon]="ic.icon"
                        [status]="ic.status"></nb-icon>
                </ng-container>
                <span>{{ data.data.estadoNuevoNombre }}</span>
            </div>
        </dx-data-grid>
    </div>
</dx-popup>
